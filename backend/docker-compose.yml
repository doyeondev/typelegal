version: '3.8'
services:
  directus:
    image: directus/directus:latest
    container_name: directus
    restart: always
    ports:
      - '8055:8055'
    env_file:
      - ../backend/.env
    environment:
      PUBLIC_URL: ${DIRECTUS_API_URL}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      DB_CLIENT: pg
      # Supabase DB 사용
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db # <--- 만약 로컬 DB 컨테이너는 안 쓴다면 제거 가능

  db:
    image: postgres:15
    container_name: directus-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: directus
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
