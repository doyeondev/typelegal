server.port=8082
spring.main.web-application-type=servlet

# .env 파일에서 변수 불러오기
spring.config.import=optional:file:.env[.properties]

# 순환 참조 허용 설정
spring.main.allow-circular-references=true

# 데이터베이스 자동 구성 (원래대로 활성화)
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# PostgreSQL 설정 (Supabase 연결)
spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool 설정 - 개발 환경용 (작은 풀 크기로 제한)
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000

# Bean 오버라이딩 허용 설정
spring.main.allow-bean-definition-overriding=true

# Hibernate 설정 
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 스프링 데이터 JPA 설정
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 데이터베이스 초기화 모드 설정
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# SSL 설정 (Supabase 필수)
spring.datasource.hikari.ssl=true
spring.datasource.properties.sslmode=require

# TCP keepalive 설정 - 타임아웃 값 조정
spring.datasource.properties.tcpKeepAlive=true
spring.datasource.properties.socketTimeout=30
spring.datasource.properties.connectTimeout=30
spring.datasource.properties.loginTimeout=30

# 로깅 설정
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=DEBUG
logging.level.org.postgresql=DEBUG
logging.level.com.zaxxer.hikari=DEBUG

# Spring Security
spring.security.user.name=${SPRING_SECURITY_USER:admin}
spring.security.user.password=${SPRING_SECURITY_PASS:admin}

# Directus 관련 설정 비활성화
directus.enabled=false
directus.mock.enabled=false

# DB 연결 실패 시 재시도 정책 설정
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.initialization-fail-timeout=10000

# 새로운 데이터소스 속성
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.leak-detection-threshold=60000

# 추가적인 Hibernate 설정
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.auto_statement_close=true

# 추가적인 Postgres 설정
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# DDL 생성 제한 (필요한 경우)
# spring.jpa.hibernate.ddl-auto=validate
